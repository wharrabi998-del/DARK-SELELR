name: DARKRESELLER

options:
  bundleIdPrefix: com.darkreseller
  deploymentTarget:
    iOS: "16.0"

targets:
  DARKRESELLER:
    type: application
    platform: iOS
    sources:
      - path: DARKRESELLER
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.darkreseller.app
        PRODUCT_NAME: DARK RESELLER
        INFOPLIST_KEY_CFBundleDisplayName: DARK RESELLER
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
