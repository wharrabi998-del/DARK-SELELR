name: Build DARK RESELLER IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project DARKRESELLER.xcodeproj \
            -scheme DARKRESELLER \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DARKRESELLER.app Payload/
          zip -r DARK-RESELLER.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DARK-RESELLER-IPA
          path: DARK-RESELLER.ipa
